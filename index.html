<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resta — Βρες την καλύτερη τιμή</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: rgba(249, 115, 22, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 28px;
            width: 100%;
            max-width: 600px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            padding-left: 48px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .quick-tags {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .quick-tags::-webkit-scrollbar {
            display: none;
        }

        .tag-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .results-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Product Card Layout */
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: var(--card-hover);
        }

        .product-img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #0f172a;
            flex-shrink: 0;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .store-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            background-color: var(--badge-bg);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .price-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .price-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
        }

        .btn-deal {
            background-color: var(--accent);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .product-card:hover .btn-deal {
            background-color: var(--accent-hover);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 0.95rem;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">R</div>
            <h1>Resta</h1>
        </div>
        <p class="subtitle">Σύγκριση τιμών & προσφορές σε πραγματικό χρόνο</p>
    </header>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Ψάξε για προϊόν (π.χ. iPhone, PS5)...">
    </div>

    <div class="quick-tags">
        <button class="tag-btn" onclick="quickSearch('iPhone')">📱 iPhone</button>
        <button class="tag-btn" onclick="quickSearch('PlayStation')">🎮 PS5</button>
    </div>

    <div id="results" class="results-container"></div>

    <footer>
        <p>© 2026 Resta Deals. Όλα τα δικαιώματα διατηρούνται.</p>
    </footer>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                console.error('Σφάλμα φόρτωσης:', error);
                document.getElementById('results').innerHTML = '<div class="no-results">Αδυναμία φόρτωσης προϊόντων.</div>';
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div class="no-results">Δεν βρέθηκαν προϊόντα.</div>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = product.link || '#';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                card.innerHTML = `
                    <img src="${product.image || 'https://via.placeholder.com/100'}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <span class="store-tag">${product.store}</span>
                        <div class="product-title">${product.name}</div>
                        <div class="meta-row">
                            ${product.badge ? `<span class="badge">${product.badge}</span>` : ''}
                        </div>
                    </div>
                    <div class="price-section">
                        <div class="price-tag">${product.price}</div>
                        <div class="btn-deal">Δες το Deal</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.store.toLowerCase().includes(query));
            displayProducts(filtered);
        });

        function quickSearch(keyword) {
            const input = document.getElementById('searchInput');
            input.value = keyword;
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(keyword.toLowerCase()));
            displayProducts(filtered);
        }

        fetchProducts();
    </script>
</body>
</html>
