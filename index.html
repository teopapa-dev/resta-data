<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resta Deals - Οι καλύτερες προσφορές</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ff6600;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .product-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .product-info {
            flex-grow: 1;
            padding-right: 15px;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .product-price {
            font-size: 18px;
            color: #ff6600;
            font-weight: bold;
        }
        .btn-deal {
            background-color: #ff6600;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-deal:hover {
            background-color: #e55b00;
        }
    </style>
</head>
<body>

    <header>
        <h1>Resta Deals</h1>
        <p>Οι καλύτερες προσφορές & ευκαιρίες της αγοράς</p>
    </header>

    <div class="container" id="products-container">
        <p style="text-align: center;">Φόρτωση προσφορών...</p>
    </div>

    <script>
        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('products-container');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">Δεν βρέθηκαν προϊόντα αυτή τη στιγμή. Δοκιμάστε ξανά αργότερα!</p>';
                    return;
                }

                data.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    const title = product.product_name || product.model_name || 'Προϊόν χωρίς όνομα';
                    const price = product.price ? product.price + ' €' : '';
                    const link = product.tracking_url || '#';

                    card.innerHTML = `
                        <div class="product-info">
                            <div class="product-title">${title}</div>
                            <div class="product-price">${price}</div>
                        </div>
                        <a href="${link}" class="btn-deal" target="_blank">Δες το Deal</a>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Σφάλμα κατά τη φόρτωση των προϊόντων:', error);
                document.getElementById('products-container').innerHTML = '<p style="text-align: center; color: red;">Σφάλμα φόρτωσης προϊόντων.</p>';
            });
    </script>

</body>
</html>
